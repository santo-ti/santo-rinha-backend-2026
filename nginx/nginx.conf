worker_processes 1;

events {
    worker_connections 2048;
}

http {
    access_log off;
    error_log /dev/null crit;

    upstream rinha_api {
        server api-1:8080;
        server api-2:8080;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://rinha_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
