# Local validation only (NOT the submission compose). Uses the legacy mem_limit/
# cpus fields, which `docker compose up` DOES honor on Docker Desktop, unlike the
# Swarm-only `deploy.resources.limits` in the real docker-compose.yml. The host CPU
# is faster than the contest Mac Mini, so p99 here is optimistic; the detection
# score (FP/FN), however, depends only on logic and is faithful.
services:
  api-1:
    image: rinha:3m-int16
    environment:
      NPROBE1: "${NPROBE1:-4}"
      NPROBE2: "${NPROBE2:-6}"
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.425
    networks: [rinha]
  api-2:
    image: rinha:3m-int16
    environment:
      NPROBE1: "${NPROBE1:-4}"
      NPROBE2: "${NPROBE2:-6}"
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.425
    networks: [rinha]
  lb:
    image: nginx:1.27-alpine
    depends_on: [api-1, api-2]
    ports: ["9999:9999"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 30m
    cpus: 0.15
    networks: [rinha]
networks:
  rinha:
    driver: bridge
