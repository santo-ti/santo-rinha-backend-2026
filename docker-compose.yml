# Local dev / build stack — mirrors the submission topology (HAProxy + 2 API instances).
# The real submission is materialized to the `submission` branch by the publish workflow
# (submission/docker-compose.yml + haproxy.cfg). This file is for local `docker compose up`.
x-api: &api
  build: .
  image: rinha-api:latest
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
