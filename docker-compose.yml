x-api: &api
  build: .
  image: rinha-api:latest
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.425"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
