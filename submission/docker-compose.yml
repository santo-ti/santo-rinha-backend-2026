# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# Search: EXACT bbox branch-and-bound over a cell-split IVF index (split cap 256) → ZERO
# routing error (det maxed at 3000), with a per-dimension early-exit on the cell scan to cut
# the p99 tail (bit-identical, E=0). NPROBE is ignored by the exact search.
#
# Transport (RETRY of UDS): HAProxy reaches each API over a Unix domain socket on the shared
# `sockets` volume, skipping the TCP/IP stack on the LB→API hop. v1.6.0's UDS attempt failed
# the contest health check ("No status"); the likely cause was the socket's default ~0755
# perms refusing HAProxy's connect — the API entrypoint now chmod 0666's the socket once Ktor
# binds it (and removes any stale socket). MUST be validated locally (docker compose up + curl)
# before submitting: a transport regression here scores nothing. TCP fallback = drop the
# `sockets` volume + `SERVER_SOCKET_PATH` and point haproxy.cfg back at `api-N:8080`.
x-api: &api
  image: __IMAGE_REF__
  networks:
    - rinha
  volumes:
    - sockets:/sockets
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api
    environment:
      SERVER_SOCKET_PATH: /sockets/api1.sock

  api-2:
    <<: *api
    environment:
      SERVER_SOCKET_PATH: /sockets/api2.sock

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:

networks:
  rinha:
    driver: bridge
