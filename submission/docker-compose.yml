# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# v1.22.0 bundle (latency, detection still maxed at 3000 / 0-error):
#   1. SCALAR cell scan (IVF_SIMD_SCAN=0): the per-dimension early-exit drops far
#      candidates after a few of the 14 dims — cheaper than the full-14-dim SIMD block
#      on the saturated tail where most points are far (santannaf's winning scan is
#      scalar too). Bit-identical squared distances → same 5-NN → E unchanged (0 error).
#      Pure env flip over the baked image; A/B by setting it back to "1".
#   2. UDS LB↔API over a shared tmpfs `sockets` volume (was loopback TCP) — drops the
#      TCP/IP stack + handshake + loopback copies; the per-request CPU it saves shortens
#      the arrival-rate queue that drives p99 (santannaf −1ms). See haproxy.cfg.
#   CPU/mem unchanged from the proven 17ms config: api 0.45/160MB ×2 + lb 0.10/30MB.
#   cpuset pinning is intentionally NOT enabled — pinning to a CPU index the eval host
#   may not have makes the whole stack fail to boot (worst case), and santannaf shipped
#   without it. To experiment on confirmed ≥4-CPU hardware, add e.g. `cpuset: "1"` /
#   `cpuset: "2"` to the APIs and `cpuset: "0"` to the lb.
x-api: &api
  image: __IMAGE_REF__
  networks:
    - rinha
  volumes:
    - sockets:/sockets
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api
    environment:
      SERVER_ENGINE: reactor
      IVF_SIMD_SCAN: "0"
      SERVER_SOCKET_PATH: /sockets/api-1.sock

  api-2:
    <<: *api
    environment:
      SERVER_ENGINE: reactor
      IVF_SIMD_SCAN: "0"
      SERVER_SOCKET_PATH: /sockets/api-2.sock

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge

# Shared in-RAM (tmpfs) directory the APIs bind their UDS into and the LB connects to.
volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs
