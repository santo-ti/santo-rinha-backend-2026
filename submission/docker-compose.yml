# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# v1.6.0: pre-rendered JSON responses (zero hot-path serialization) + HAProxy reaches
# each API over a UNIX DOMAIN SOCKET on a shared tmpfs volume (SERVER_SOCKET_PATH) — no
# loopback TCP on the LB→API hop, a p99 cut the top entries rely on. NPROBE 16/12 is the
# CHAMPION config: preview #7644 (image 1.4.0, HAProxy TCP, 16/12) scored 4777 at p99
# 5.6ms with detection maxed (E=37). This image adds UDS + pre-rendered on top; if a
# preview shows http_errors (native unix-bind issue) or a p99 regression, restore the
# 4777 baseline: image 1.4.0 + TCP haproxy.cfg (server apiN api-N:8080) + NPROBE 16/12.

services:
  api-1:
    image: __IMAGE_REF__
    environment:
      NPROBE1: "16"
      NPROBE2: "12"
      SERVER_SOCKET_PATH: /sockets/api1.sock
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api-2:
    image: __IMAGE_REF__
    environment:
      NPROBE1: "16"
      NPROBE2: "12"
      SERVER_SOCKET_PATH: /sockets/api2.sock
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge
