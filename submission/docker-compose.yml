# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
x-api: &api
  image: __IMAGE_REF__
  # Per-query search budget (distance evals) for the DEPTH-FIRST VP-tree search.
  # Tunable here WITHOUT rebuilding the image — the runtime reads $SEARCH_BUDGET
  # (see bootstrap.IndexLoader). best-first was abandoned: its priority-queue
  # overhead pushed p99 to 2001ms (#7359 cut) / 378ms (#7363). DFS is O(1)/node
  # (no heap), so #7265 ran budget 4096 at p99 17ms — it affords a much higher
  # budget. DFS detection knee: 16384 (weighted E29 on a 10k randomized sample,
  # vs E123 at 8192). Drop to 8192 if the real Mac Mini p99 saturates.
  environment:
    SEARCH_BUDGET: "16384"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
