# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
x-api: &api
  image: __IMAGE_REF__
  # Per-query search budget (distance evals). Tunable here WITHOUT rebuilding the
  # image — the runtime reads $SEARCH_BUDGET (see bootstrap.IndexLoader). Over the
  # full 3M int16 index, 4096 gives det ~2688 with 0 http_errors and ~130MiB peak
  # in local k6. Lower to 2048 (det ~2155, less CPU/req) if the real Mac Mini p99
  # suffers, or raise toward 8192 (→ exact, det ~2819) if it has headroom.
  environment:
    SEARCH_BUDGET: "4096"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.425"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
