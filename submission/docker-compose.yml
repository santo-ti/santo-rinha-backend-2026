# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# v1.5.0: HAProxy reaches each API over a UNIX DOMAIN SOCKET on a shared tmpfs volume
# (SERVER_SOCKET_PATH) — no loopback TCP on the LB→API hop, a p99 cut the top entries
# rely on. NPROBE starts at 4/6 (the proven 3788 detection) to isolate the UDS latency
# effect; raise on the branch (no rebuild) once the p99 headroom is confirmed.

services:
  api-1:
    image: __IMAGE_REF__
    environment:
      NPROBE1: "4"
      NPROBE2: "6"
      SERVER_SOCKET_PATH: /sockets/api1.sock
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api-2:
    image: __IMAGE_REF__
    environment:
      NPROBE1: "4"
      NPROBE2: "6"
      SERVER_SOCKET_PATH: /sockets/api2.sock
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge
