# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
x-api: &api
  image: __IMAGE_REF__
  # Cells probed per query for the IVF search. Tunable here WITHOUT rebuilding the
  # image — the runtime reads $NPROBE (see bootstrap.IndexLoader). Calibrated offline
  # over the 3M refs with randomized-date queries (tools.IvfCalibrate, k=4096): recall
  # stops improving past ~16 probes (the residual error is the int16 quantization
  # floor, not truncation), so 16 buys exact-quality detection at the lowest scan
  # cost. Raise toward 24/32 only if a real preview shows p99 headroom AND missing
  # recall; lower to 8 (det still ~2090) if CPU saturates.
  environment:
    NPROBE: "16"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
