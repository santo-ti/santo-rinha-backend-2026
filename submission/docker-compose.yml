# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# CONFIG: Ktor CIO + scalar exact IVF search over plain TCP — the proven best.
# Official previews settled it: Ktor CIO + IVF-exact SCALAR = p99 ~17ms / score ~4766
# (0 error, detection maxed at 3000). The single-thread NIO reactor regressed under the
# 0.45-CPU / 900-rps saturation (reactor+SIMD 88ms/4055; reactor+scalar+UDS 46ms/4335) —
# the reactor is the bottleneck, not the search — so the reactor is kept in the image but
# NOT selected here. SERVER_ENGINE="" -> Ktor CIO (the image bakes reactor; override it).
# IVF_SIMD_SCAN=0 -> scalar per-dim early-exit (cheaper than the full-14-dim SIMD block on
# the saturated tail). The approximate search is faster (5.6ms) but the per-error detection
# penalty (~90 pts/error near E=0) makes it only break-even vs exact, so we stay exact/0-error.
# UDS is dropped (it only helped the reactor; Ktor's unixConnector failed the health check,
# #7683), so the API speaks plain TCP :8080 and HAProxy forwards bytes. cpuset NOT enabled
# (pinning to an absent CPU would fail to boot; the top Java entry shipped without it).
x-api: &api
  image: __IMAGE_REF__
  networks:
    - rinha
  environment:
    SERVER_ENGINE: ""
    IVF_SIMD_SCAN: "0"
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
