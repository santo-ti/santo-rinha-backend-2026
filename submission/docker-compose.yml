# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
x-api: &api
  image: __IMAGE_REF__
  # Two-level IVF routing: $NPROBE1 districts → $NPROBE2 cells per query. Tunable
  # here WITHOUT rebuilding the image (runtime reads them — see bootstrap.IndexLoader).
  # Calibrated offline over the 3M refs with randomized-date queries (tools.IvfTwoLevel,
  # k=4096, k1=64): NPROBE1=4/NPROBE2=6 ≈ 3.8k comparisons/query (≈0.23ms on the contest
  # core, well under ~1ms) at detection ~exact (contest E≈81). Flat single-level routing
  # cost ~16k comps and saturated (#7422/#7428, p99 cut). Lower NPROBE2 (4) if CPU is
  # tight; raise (8) only if a preview shows p99 headroom AND missing recall.
  environment:
    NPROBE1: "4"
    NPROBE2: "6"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
