# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
x-api: &api
  image: __IMAGE_REF__
  # Per-query search budget (distance evals). Tunable here WITHOUT rebuilding the
  # image — the runtime reads $SEARCH_BUDGET (see bootstrap.IndexLoader). With the
  # best-first search over the full 3M int16 index, 32768 reaches exact-quality
  # detection (E=0 vs the official oracle on randomized-date payloads) at ~13k mean
  # distance evals. Drop to 16384 (E≈1, ~9.5k evals) if the real Mac Mini p99 or
  # RSS needs more headroom; 8192 (E≈8) is the conservative floor.
  environment:
    SEARCH_BUDGET: "32768"
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.425"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: nginx:1.27-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
