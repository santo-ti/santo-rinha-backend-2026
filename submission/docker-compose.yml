# Submission stack — consumed by the Rinha evaluation from the `submission` branch.
# The API image is pulled from a public registry (no `build:`), since the
# `submission` branch carries no source code. The `__IMAGE_REF__` placeholder is
# replaced with the freshly published, immutable tag by
# .github/workflows/publish-submission.yml when it materializes the branch.
#
# v1.7.0: EXACT bbox branch-and-bound search over a cell-split IVF index (santannaf's
# algorithm) → ZERO routing error (det maxed) at low scanned-point cost (offline over
# 3M randomized-date queries: E=0, points mean 3.4k / p99 16.6k). NPROBE is IGNORED by
# the exact search, so it is not set here. LB is HAProxy in TCP mode (the proven 4777
# infra) — UDS was tried in v1.6.0 and FAILED the contest health check ("No status"),
# so the API speaks plain TCP on :8080 and HAProxy forwards bytes.
x-api: &api
  image: __IMAGE_REF__
  networks:
    - rinha
  deploy:
    resources:
      limits:
        cpus: "0.45"
        memory: "160MB"

services:
  api-1:
    <<: *api

  api-2:
    <<: *api

  lb:
    image: haproxy:2.9-alpine
    depends_on:
      - api-1
      - api-2
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
