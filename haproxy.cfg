# HAProxy load balancer for the Rinha submission. TCP mode (no HTTP parsing) for the
# lowest per-request overhead; single thread to match the 0.10-CPU budget. The API
# instances listen on UNIX DOMAIN SOCKETS (shared tmpfs volume /sockets), not TCP —
# this skips the loopback TCP/IP stack on the LB→API hop, a measured p99 win that the
# top entries (santannaf ~5.6ms, villanidev) rely on. HAProxy just pipes bytes from
# the client connection (:9999) to the backend unix socket.
global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    timeout queue 3s

frontend main
    bind *:9999 backlog 4096
    default_backend api

backend api
    balance roundrobin
    default-server maxconn 8000
    server api1 /sockets/api1.sock check inter 2s
    server api2 /sockets/api2.sock check inter 2s
