# HAProxy load balancer for the Rinha submission — replaces nginx. TCP mode (no
# HTTP parsing) for the lowest per-request overhead; single thread to match the
# 0.10-CPU budget. The API speaks plain HTTP on :8080, so HAProxy just forwards
# bytes. Tuning (v1.9.0): leastconn (even under uneven backend latency) + the
# tcp-smart accept/connect pair (combine the setup ACK with the first data segment,
# saving a round trip on connection establishment). All options are valid in TCP
# mode and cannot regress steady-state forwarding — the LB is not the bottleneck
# (the same config ran 5.6ms at #7644 and 17.5ms at #7690; the search drove both).
global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    timeout queue 3s

frontend main
    bind *:9999 backlog 4096
    option tcp-smart-accept
    default_backend api

backend api
    balance leastconn
    option tcp-smart-connect
    default-server maxconn 8000
    server api1 api-1:8080
    server api2 api-2:8080
