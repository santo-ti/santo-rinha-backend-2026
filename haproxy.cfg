# HAProxy load balancer for the Rinha submission. TCP mode (no HTTP parsing) for the
# lowest per-request overhead; single thread to match the 0.10-CPU budget. The API speaks
# plain HTTP on :8080, so HAProxy just forwards bytes. Tuning: leastconn + the tcp-smart
# accept/connect pair (combine the setup ACK with the first data segment, saving a round
# trip on connection establishment). This is the proven ~4766 infra (Ktor + IVF scalar).
# (UDS over tmpfs was tried with the reactor and works, but the reactor was slower overall,
# so the submission runs Ktor over TCP — see submission/docker-compose.yml.)
global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    timeout queue 3s

frontend main
    bind *:9999 backlog 4096
    option tcp-smart-accept
    default_backend api

backend api
    balance leastconn
    option tcp-smart-connect
    default-server maxconn 8000
    server api1 api-1:8080
    server api2 api-2:8080
