# HAProxy load balancer for the Rinha submission — replaces nginx. TCP mode (no
# HTTP parsing) for the lowest per-request overhead; single thread to match the
# 0.10-CPU budget. Tuning: leastconn (even under uneven backend latency) + tcp-smart-accept
# on the client side (combine the setup ACK with the first data segment).
#
# Backends are UNIX domain sockets on the shared `sockets` volume (the API binds them, see
# the entrypoint + submission/docker-compose.yml), so the LB→API hop skips the TCP/IP stack.
# `check` keeps a backend out of rotation until its socket is bound, chmod'd and connectable
# (the API removes any stale socket and relaxes perms to 0666 on bind). For a plain-TCP
# fallback, point the servers back at `api-N:8080` and drop the shared volume.
global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    timeout queue 3s

frontend main
    bind *:9999 backlog 4096
    option tcp-smart-accept
    default_backend api

backend api
    balance leastconn
    default-server maxconn 8000 check inter 1s rise 1 fall 3
    server api1 /sockets/api1.sock
    server api2 /sockets/api2.sock
