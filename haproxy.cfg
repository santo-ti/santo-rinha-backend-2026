# HAProxy load balancer for the Rinha submission. TCP mode (no HTTP parsing) for the
# lowest per-request overhead; single thread to match the 0.10-CPU budget.
#
# v1.22.0: LB↔API now over a UNIX DOMAIN SOCKET on a shared tmpfs volume (was loopback
# TCP). UDS drops the TCP/IP stack, the 3-way handshake and the loopback copies — under
# the saturated 900-rps arrival-rate that is per-request CPU the API gets back, shortening
# the queue that drives the p99 tail (santannaf's measured −1ms). The earlier Ktor UDS
# attempt failed the contest health check ("No status", #7683); the NIO reactor fixes the
# operational details it missed — it binds the socket at startup (before /ready), clears a
# stale socket, and widens perms to 0666 so this LB (a separate container) can connect. The
# `check` brings each backend UP the instant its socket appears.
global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    timeout queue 3s

frontend main
    bind *:9999 backlog 4096
    option tcp-smart-accept
    default_backend api

backend api
    balance leastconn
    default-server maxconn 8000 check inter 500ms rise 1 fall 3
    server api1 /sockets/api-1.sock
    server api2 /sockets/api-2.sock
